name: CI

on:
  push:
    branches:
      - boneman/main
  pull_request:
    branches:
      - boneman/main
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to validate.
        required: false
        type: string
      base_sha:
        description: Committed-range base for whitespace validation.
        required: false
        type: string
      head_sha:
        description: Committed-range head for whitespace validation.
        required: false
        type: string
      trusted_validator_ref:
        description: Exact maintained-branch commit supplying trusted policy scripts.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository and translation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository and submodules
        if: inputs.trusted_validator_ref == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
          submodules: recursive

      - name: Check out trusted validation implementation
        if: inputs.trusted_validator_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.trusted_validator_ref }}
          submodules: false

      - name: Check out untrusted upstream candidate
        if: inputs.trusted_validator_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
          submodules: recursive

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install pinned ripgrep
        env:
          RIPGREP_VERSION: 15.2.0
          RIPGREP_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${archive}"
          echo "${RIPGREP_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"

      - name: Validate repository and translation privacy boundary
        working-directory: ${{ inputs.trusted_validator_ref != '' && 'candidate' || '.' }}
        env:
          CI_COMMITTED_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          CI_COMMITTED_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          VALIDATOR_PATH: ${{ inputs.trusted_validator_ref != '' && '../scripts/ci-validate-repository.sh' || 'scripts/ci-validate-repository.sh' }}
        run: "${VALIDATOR_PATH}"

      - name: Validate workflows and helper scripts
        working-directory: ${{ inputs.trusted_validator_ref != '' && 'candidate' || '.' }}
        run: |
          set -euo pipefail
          actionlint -color
          shellcheck --severity=warning scripts/build-local.sh scripts/doctor.sh scripts/ci-*.sh scripts/check-*.sh
          python3 -m py_compile scripts/ci-monitor-telegram-upstream.py scripts/run-with-memory-guard.py scripts/verify-ipa.py
          python3 scripts/ci-monitor-telegram-upstream.py --self-test
          python3 scripts/verify-ipa.py --help >/dev/null
          scripts/ci-test-sync-upstream.sh

      - name: Scan tracked source and changed history for secrets
        working-directory: ${{ inputs.trusted_validator_ref != '' && 'candidate' || '.' }}
        env:
          MEMORY_GUARD_PATH: ${{ inputs.trusted_validator_ref != '' && '../scripts/run-with-memory-guard.py' || 'scripts/run-with-memory-guard.py' }}
          SCAN_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 "${MEMORY_GUARD_PATH}" \
            --max-process-mib 4096 \
            --max-group-mib 8192 \
            -- gitleaks dir . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path . \
            --redact=100 \
            --timeout 1800 \
            --no-banner
          if [[ "${SCAN_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] && \
             [[ "${SCAN_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] && \
             [[ "${SCAN_BASE_SHA}" != 0000000000000000000000000000000000000000 ]]; then
            log_range="${SCAN_BASE_SHA}..${SCAN_HEAD_SHA}"
          elif git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            log_range="HEAD^1..HEAD"
          else
            log_range="HEAD"
          fi
          python3 "${MEMORY_GUARD_PATH}" \
            --max-process-mib 4096 \
            --max-group-mib 8192 \
            -- gitleaks git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path /dev/null \
            --log-opts="${log_range}" \
            --redact=100 \
            --timeout 1800 \
            --no-banner

  translation-tests:
    name: Run Boneman translation tests
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
          submodules: recursive

      - name: Show Apple build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version

      - name: Run unsigned-safe translation tests
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          ci_configuration="${RUNNER_TEMP}/swiftgram-ci-configuration.json"
          jq '. + {sg_config: ""}' \
            build-system/appstore-configuration.json > "${ci_configuration}"
          chmod 600 "${ci_configuration}"
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="${RUNNER_TEMP}/bazel-root" \
            --cacheDir="${RUNNER_TEMP}/bazel-cache" \
            test \
            --configurationPath="${ci_configuration}" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --target=//Swiftgram/BonemanTranslation:BonemanTranslationTests

          test_log="bazel-testlogs/Swiftgram/BonemanTranslation/BonemanTranslationTests/test.log"
          test -s "${test_log}"
          python3 - "${test_log}" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          expected_classes = {
              "BonemanTranslationPolicyTests",
              "BonemanTranslationCacheTests",
              "BonemanTranslationBoundedIndexTests",
              "BonemanTranslationWorkQueueTests",
          }
          missing = sorted(name for name in expected_classes if name not in text)
          if missing:
              raise SystemExit(f"Boneman Translation XCTest classes did not execute: {missing}")
          matches = re.findall(
              r"Executed\s+([1-9][0-9]*)\s+tests?,\s+with\s+0\s+failures(?:\s+\([0-9]+\s+unexpected\))?",
              text,
          )
          if not matches:
              raise SystemExit("Boneman Translation XCTest log has no zero-failure execution summary")
          print(f"Boneman Translation XCTest execution confirmed: {matches[-1]} tests")
          PY

          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="${RUNNER_TEMP}/bazel-root" \
            --cacheDir="${RUNNER_TEMP}/bazel-cache" \
            test \
            --configurationPath="${ci_configuration}" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --target=//Swiftgram/SGPushEnvironment:SGPushEnvironmentTests

          push_test_log="bazel-testlogs/Swiftgram/SGPushEnvironment/SGPushEnvironmentTests/test.log"
          test -s "${push_test_log}"
          python3 - "${push_test_log}" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          if "SGPushEnvironmentTests" not in text:
              raise SystemExit("SG Push Environment XCTest class did not execute")
          matches = re.findall(
              r"Executed\s+([1-9][0-9]*)\s+tests?,\s+with\s+0\s+failures(?:\s+\([0-9]+\s+unexpected\))?",
              text,
          )
          if not matches:
              raise SystemExit("SG Push Environment XCTest log has no zero-failure execution summary")
          print(f"SG Push Environment XCTest execution confirmed: {matches[-1]} tests")
          PY
